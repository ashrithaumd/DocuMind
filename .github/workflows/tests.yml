# Backend test suite: unit + integration, no secrets needed.
# LLM calls (both providers' SDK clients) and embeddings are stubbed, so the
# suite is keyless by design. The chunk store and query log run on a real
# Postgres + pgvector service container (a fresh database per test); unit
# tests that only need the log tables use SQLite. The RAGAS eval is NOT run
# here: it needs a real provider key.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    # Pinned: setup-python has no 3.12.8 build for Ubuntu 26.04, which
    # ubuntu-latest is migrating to.
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind
          POSTGRES_DB: documind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"  # same as backend/Dockerfile and backend/.venv
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        # CPU-only torch first, so sentence-transformers doesn't drag the
        # multi-GB CUDA build into a CI runner with no GPU. Same version as
        # backend/.venv and the Dockerfile. constraints.txt pins every
        # transitive dependency to the baseline venv. The eval requirements
        # go in last, as their own install, so tests that import the eval
        # harness (test_torch_imports.py) run; any change to an app package
        # would show here as an "Attempting uninstall" line.
        run: |
          pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt \
            -c backend/constraints.txt
          pip install -r backend/eval/requirements.txt -c backend/constraints.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg2://documind:documind@localhost:5432/documind
          # Postgres tests must run here, not skip.
          REQUIRE_POSTGRES_TESTS: "1"
        run: python -m pytest tests -v
