# Backend test suite: unit + integration, no secrets needed.
# LLM calls (Claude) are stubbed, embeddings are stubbed (the real ones are
# local sentence-transformers anyway), Chroma runs embedded, and the log DB
# is SQLite — the suite is hermetic by design. The RAGAS eval is NOT run
# here: it needs a real ANTHROPIC_API_KEY and costs money (see README).
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        # CPU-only torch first, so sentence-transformers doesn't drag the
        # multi-GB CUDA build into a CI runner with no GPU.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: test-key-ci # never used: all LLM calls are stubbed
        run: python -m pytest tests -v
