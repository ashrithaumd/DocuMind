# Backend test suite: unit + integration, no secrets needed.
# LLM calls (both providers' SDK clients) are stubbed, embeddings are stubbed
# (the real ones are local sentence-transformers anyway), Chroma runs
# embedded, and the log DB is SQLite — the suite is hermetic and keyless by
# design. The RAGAS eval is NOT run here: it needs a real provider key.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    # Pinned: setup-python has no 3.12.8 build for Ubuntu 26.04, which
    # ubuntu-latest is migrating to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"  # same as backend/Dockerfile and backend/.venv
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        # CPU-only torch first, so sentence-transformers doesn't drag the
        # multi-GB CUDA build into a CI runner with no GPU. Same version as
        # backend/.venv and the Dockerfile. constraints.txt pins every
        # transitive dependency to the baseline venv.
        run: |
          pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt \
            -c backend/constraints.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -v
