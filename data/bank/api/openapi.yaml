# DRAFT, pending review. FinPilot Bank is a fictional bank created for a
# software project; this API does not exist. FinPilot's tools (Phase 5)
# mirror these operations against the bank's database.
openapi: 3.1.0
info:
  title: FinPilot Bank Customer Data API
  version: 1.3.0
  summary: Read access to a signed-in customer's own accounts, cards, transactions, fees and holdings.
  description: |
    Every operation acts for the **authenticated customer only**. There is no
    way to name another customer: account, card and transaction ids that
    belong to someone else return `404`, exactly as ids that don't exist, so
    the API never confirms that another customer's resource exists.

    Money is returned as integer **cents** in `amount_cents`, with the
    currency in `currency` (always `USD`). Negative amounts are money leaving
    the account.

    Rate limit: 60 requests a minute per customer. Over the limit returns `429`
    with a `Retry-After` header.

    Changes in 1.3.0 (2026-02-01): `fee_schedule_version` on every fee;
    `waived` filter on `/fees`; `cushion_applied` on overdraft fees.
servers:
  - url: https://api.finpilot-bank.example/v1
security:
  - customerAuth: [accounts:read]
tags:
  - name: Accounts
  - name: Transactions
  - name: Fees
  - name: Cards
  - name: Investing
  - name: Disputes

paths:
  /me:
    get:
      operationId: getCustomer
      tags: [Accounts]
      summary: The signed-in customer's profile.
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Customer"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: The customer's accounts with current and available balances.
      parameters:
        - name: type
          in: query
          schema: {$ref: "#/components/schemas/AccountType"}
        - name: status
          in: query
          schema: {type: string, enum: [open, frozen, closed], default: open}
      responses:
        "200":
          description: Accounts, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: {$ref: "#/components/schemas/Account"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /accounts/{account_id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "404": {$ref: "#/components/responses/NotFound"}

  /accounts/{account_id}/transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: Posted transactions on one account, newest first, paginated.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: from
          in: query
          description: First posting date, inclusive.
          schema: {type: string, format: date}
        - name: to
          in: query
          description: Last posting date, inclusive. At most 366 days after `from`.
          schema: {type: string, format: date}
        - name: category
          in: query
          schema: {$ref: "#/components/schemas/Category"}
        - name: min_amount_cents
          in: query
          description: Absolute amount, so 5000 matches both -5000 and 5000.
          schema: {type: integer, minimum: 0}
        - name: merchant
          in: query
          description: Case-insensitive substring of the merchant name.
          schema: {type: string, maxLength: 64}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of transactions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items: {$ref: "#/components/schemas/Transaction"}
                  next_cursor: {type: [string, "null"]}
              example:
                transactions:
                  - txn_id: cust-0007-t00412
                    account_id: cust-0007-chk
                    posted_on: "2026-02-03"
                    amount_cents: -6000
                    currency: USD
                    merchant: Riverside ATM
                    category: cash
                    description: ATM withdrawal (out of network)
                    card_last4: "1937"
                next_cursor: eyJwIjoiMjAyNi0wMi0wMyJ9
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /accounts/{account_id}/fees:
    get:
      operationId: listFees
      tags: [Fees]
      summary: Fees assessed on one account, with the schedule version that set each amount.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: fee_type
          in: query
          schema: {$ref: "#/components/schemas/FeeType"}
        - name: waived
          in: query
          schema: {type: boolean}
      responses:
        "200":
          description: Fees, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fees:
                    type: array
                    items: {$ref: "#/components/schemas/Fee"}
                  total_cents:
                    type: integer
                    description: Sum of the fees returned, excluding waived ones.
        "404": {$ref: "#/components/responses/NotFound"}

  /cards:
    get:
      operationId: listCards
      tags: [Cards]
      responses:
        "200":
          description: The customer's cards. Full card numbers are never returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items: {$ref: "#/components/schemas/Card"}

  /cards/{card_id}/lock:
    post:
      operationId: lockCard
      tags: [Cards]
      summary: Lock a card. Purchases and withdrawals are declined until it's unlocked.
      security:
        - customerAuth: [cards:write]
      parameters:
        - name: card_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The locked card.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Card"}
        "404": {$ref: "#/components/responses/NotFound"}

  /holdings:
    get:
      operationId: listHoldings
      tags: [Investing]
      summary: Positions in the customer's Self-Directed Investing account, valued at the last close.
      responses:
        "200":
          description: Holdings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of: {type: string, format: date}
                  holdings:
                    type: array
                    items: {$ref: "#/components/schemas/Holding"}

  /securities/{symbol}/prices:
    get:
      operationId: listPrices
      tags: [Investing]
      summary: Daily closing prices. Public reference data, the same for every customer.
      parameters:
        - name: symbol
          in: path
          required: true
          schema: {type: string, pattern: "^[A-Z.]{1,6}$"}
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
      responses:
        "200":
          description: Prices, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol: {type: string}
                  prices:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        close: {type: number}
        "404": {$ref: "#/components/responses/NotFound"}

  /disputes:
    post:
      operationId: createDispute
      tags: [Disputes]
      summary: Open a dispute on a transaction or fee. See the Dispute Policy for timelines.
      security:
        - customerAuth: [disputes:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                txn_id: {type: string}
                fee_id: {type: string}
                reason:
                  type: string
                  enum: [unauthorized, wrong_amount, duplicate, not_received, fee_error, other]
                details: {type: string, maxLength: 2000}
              oneOf:
                - required: [txn_id]
                - required: [fee_id]
      responses:
        "201":
          description: The dispute was opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispute_id: {type: string}
                  status: {type: string, enum: [received]}
                  respond_by: {type: string, format: date, description: "10 business days for deposit accounts; 30 days for the credit card."}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A dispute is already open for this transaction or fee.

components:
  securitySchemes:
    customerAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.finpilot-bank.example/authorize
          tokenUrl: https://auth.finpilot-bank.example/token
          scopes:
            accounts:read: Read the customer's own accounts, transactions, fees and holdings.
            cards:write: Lock and unlock the customer's own cards.
            disputes:write: Open disputes on the customer's own transactions and fees.

  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}

  responses:
    Unauthorized:
      description: Missing or expired token.
    NotFound:
      description: No such resource **for this customer**. Another customer's ids also return 404.
    BadRequest:
      description: A parameter is invalid, e.g. a date range longer than 366 days.

  schemas:
    AccountType:
      type: string
      enum: [checking, savings, credit, brokerage]
    Category:
      type: string
      enum: [income, housing, groceries, dining, transport, subscriptions, health, home,
             shopping, travel, cash, transfer, interest]
    FeeType:
      type: string
      enum: [overdraft, nsf, monthly_maintenance, atm, foreign_transaction, wire, late_payment]
    Customer:
      type: object
      properties:
        customer_id: {type: string}
        full_name: {type: string}
        segment: {type: string, enum: [retail, premier, student]}
        joined_on: {type: string, format: date}
    Account:
      type: object
      properties:
        account_id: {type: string}
        type: {$ref: "#/components/schemas/AccountType"}
        product: {type: string, examples: [Everyday Checking]}
        status: {type: string, enum: [open, frozen, closed]}
        opened_on: {type: string, format: date}
        balance_cents: {type: integer}
        available_balance_cents: {type: integer}
        currency: {type: string, const: USD}
    Transaction:
      type: object
      properties:
        txn_id: {type: string}
        account_id: {type: string}
        posted_on: {type: string, format: date}
        amount_cents: {type: integer, description: Negative for money out.}
        currency: {type: string, const: USD}
        merchant: {type: [string, "null"]}
        category: {$ref: "#/components/schemas/Category"}
        description: {type: string}
        card_last4: {type: [string, "null"], pattern: "^[0-9]{4}$"}
    Fee:
      type: object
      properties:
        fee_id: {type: string}
        account_id: {type: string}
        txn_id: {type: [string, "null"], description: The transaction that caused the fee, if any.}
        fee_type: {$ref: "#/components/schemas/FeeType"}
        amount_cents: {type: integer, minimum: 1}
        assessed_on: {type: string, format: date}
        waived: {type: boolean}
        fee_schedule_version:
          type: string
          enum: ["2025", "2026"]
          description: The Schedule of Fees in force on `assessed_on` ("2026" from 2026-02-01).
        cushion_applied:
          type: boolean
          description: Overdraft fees only. Always false before 2026-02-01, when the $50 cushion began.
    Card:
      type: object
      properties:
        card_id: {type: string}
        account_id: {type: string}
        last4: {type: string, pattern: "^[0-9]{4}$"}
        network: {type: string, enum: [visa, mastercard]}
        status: {type: string, enum: [active, locked, closed]}
        expires_on: {type: string, format: date}
    Holding:
      type: object
      properties:
        symbol: {type: string}
        quantity: {type: number}
        cost_basis_cents: {type: integer}
        last_close: {type: number}
        market_value_cents: {type: integer}
        unrealized_gain_cents: {type: integer}
