# DocuMind — full local stack. `docker compose up --build` brings up:
#   frontend  (nginx-served Vite build, proxies /api -> backend)
#   migrate   (one-shot: migrations, documind_app's password, embedding-model
#              check, as the owner; the backend waits for it to succeed)
#   backend   (FastAPI + LangGraph pipeline; connects only as documind_app)
#   postgres  (pgvector: chunk store with vector + full-text search, and the
#              query/audit log; persisted in a named volume)
#
# Secrets come from .env (see .env.example) — never hardcoded here.

services:
  frontend:
    build:
      context: ./frontend
      # The Firebase web config for the sign-in screen (public values).
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      # Override with FRONTEND_PORT in .env if 3000 is taken on your machine.
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  migrate:
    build: ./backend
    command: ["python", "migrate.py"]
    environment:
      # The owner's credentials live only here, never in the backend.
      MIGRATION_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind}@postgres:5432/${POSTGRES_DB:-documind}
      # Read for documind_app's password, which this step sets.
      DATABASE_URL: postgresql+psycopg2://documind_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-documind}
      # The vector column's size and the model check follow these, so they
      # must match the backend's.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      # Override with BACKEND_PORT in .env if 8000 is taken on your machine.
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      GRADING_MODEL: ${GRADING_MODEL:-}
      GRADING_THINKING_LEVEL: ${GRADING_THINKING_LEVEL:-minimal}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      EMBEDDING_USE_VERTEXAI: ${EMBEDDING_USE_VERTEXAI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Only the documind_app role (row-level security applies to it). The
      # backend refuses to start if MIGRATION_DATABASE_URL is set.
      DATABASE_URL: postgresql+psycopg2://documind_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-documind}
    volumes:
      # Local embedding model cache (~90 MB, only with EMBEDDING_PROVIDER=local;
      # downloaded from HuggingFace on first start) — persisted so
      # rebuilds/restarts don't re-download it.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    # Postgres 16 with pgvector 0.8.7 (iterative index scans need >= 0.8).
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  hf_cache:
