# Serves the built SPA and proxies /api/* to the backend service.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: the frontend only ever calls /api/...
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        # SSE: no buffering, long-lived connection
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';

        client_max_body_size 25m;  # PDF uploads (backend enforces 20 MB)
    }
}
